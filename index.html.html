<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DUCKPOCALYPSE — El pato tiene la culpa</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a0d;font-family:Inter,Segoe UI,Arial,sans-serif}
body{display:grid;place-items:center}
canvas{display:block;width:min(100vw,1400px);height:auto;aspect-ratio:16/9;background:#6fa54f;box-shadow:0 18px 80px rgba(0,0,0,.72)}

#mobileControls{display:none;position:fixed;inset:0;z-index:20;pointer-events:none;touch-action:none}
.mobile-btn{position:absolute;width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,255,255,.32);background:rgba(10,15,18,.58);color:#fff;font:900 20px Arial;display:grid;place-items:center;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none;backdrop-filter:blur(3px)}
.mobile-btn.small{width:58px;height:58px;font-size:15px}
#joy{left:24px;bottom:24px;width:148px;height:148px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(10,15,18,.28);position:absolute;pointer-events:auto;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.35);pointer-events:none}
#mbAttack{right:26px;bottom:34px}#mbQ{right:104px;bottom:112px}#mbDash{right:28px;bottom:118px}
#mbInteract{right:182px;bottom:34px}#mbPause{right:24px;top:24px}
#mbStart{left:50%;top:62%;transform:translate(-50%,-50%);width:180px;height:62px;border-radius:16px;background:rgba(20,28,32,.85);font-size:22px}
@media (max-width:900px),(pointer:coarse){body{background:#050709}canvas{width:100vw;height:auto;max-height:100vh;box-shadow:none}#mobileControls{display:block}}
@media (orientation:portrait) and (max-width:900px){#mobileControls:after{content:'Gira el celular horizontalmente para jugar mejor';position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:10px;background:rgba(0,0,0,.65);color:#fff;font:700 12px Arial;white-space:nowrap;pointer-events:none}}
</style>
</head>
<body>
<canvas id="game" width="1400" height="788"></canvas>
<div id="mobileControls" aria-hidden="true">
  <div id="joy"><div id="joyKnob"></div></div>
  <div class="mobile-btn" id="mbAttack">⚔</div>
  <div class="mobile-btn" id="mbQ">Q</div>
  <div class="mobile-btn" id="mbDash">↯</div>
  <div class="mobile-btn" id="mbInteract">E</div>
  <div class="mobile-btn small" id="mbPause">Ⅱ</div>
  <div class="mobile-btn" id="mbStart">JUGAR</div>
</div>
<script>
'use strict';

/* ============================================================
   DUCKPOCALYPSE — COMPLETE EDITION
   Single-file HTML. No external assets.
   ============================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = true;

const W = canvas.width;
const H = canvas.height;
const WORLD = {w:4800,h:3200};
const TAU = Math.PI*2;

let state='menu'; // menu | world | boss | won | lost
let paused=false;
let elapsed=0;
let lastTime=performance.now();
let shake=0;
let camera={x:0,y:0,zoom:1};
let toast={text:'',time:0};
let audioCtx=null;

const keys=Object.create(null);
const pressed=Object.create(null);

function keyName(e){
  const code=String(e.code||'');
  const codeMap={Space:'space',ShiftLeft:'shift',ShiftRight:'shift',Escape:'escape',ArrowUp:'arrowup',ArrowDown:'arrowdown',ArrowLeft:'arrowleft',ArrowRight:'arrowright',KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',KeyE:'e',KeyQ:'q',KeyR:'r',KeyP:'p'};
  if(codeMap[code]) return codeMap[code];
  return String(e.key||'').toLowerCase();
}
function preventScroll(e){
  const k=keyName(e);
  if(['w','a','s','d','e','q','r','p','shift','escape','space','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
}
addEventListener('keydown',e=>{
  preventScroll(e);
  const k=keyName(e);
  if(!keys[k]) pressed[k]=true;
  keys[k]=true;
});
addEventListener('keyup',e=>{ keys[keyName(e)]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; for(const k in pressed) delete pressed[k]; });


/* ============================== MOBILE CONTROLS ============================== */
const mobilePointers=new Map();
function setVirtualKey(k,on){
  if(on){if(!keys[k])pressed[k]=true;keys[k]=true;}
  else keys[k]=false;
}
function bindMobileAction(id,key){
  const el=document.getElementById(id); if(!el)return;
  const down=e=>{e.preventDefault();ensureAudio();mobilePointers.set(e.pointerId,key);setVirtualKey(key,true);el.setPointerCapture?.(e.pointerId);};
  const up=e=>{e.preventDefault();if(mobilePointers.get(e.pointerId)===key){mobilePointers.delete(e.pointerId);setVirtualKey(key,false);}};
  el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',e=>{if(e.buttons===0)up(e);});
}
bindMobileAction('mbAttack','space');bindMobileAction('mbQ','q');bindMobileAction('mbDash','shift');bindMobileAction('mbInteract','e');bindMobileAction('mbPause','p');bindMobileAction('mbStart','enter');
const joy=document.getElementById('joy'),joyKnob=document.getElementById('joyKnob');
let joyPointer=null;
function updateJoystick(e){
  const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.34;const d=Math.hypot(dx,dy);
  if(d>max){dx=dx/d*max;dy=dy/d*max;}
  joyKnob.style.transform=`translate(${dx}px,${dy}px)`;
  const dead=12;
  setVirtualKey('a',dx<-dead);setVirtualKey('d',dx>dead);setVirtualKey('w',dy<-dead);setVirtualKey('s',dy>dead);
  if(Math.abs(dx)>dead||Math.abs(dy)>dead){const n=norm(dx,dy);player.facingX=n.x;player.facingY=n.y;}
}
joy.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();joyPointer=e.pointerId;joy.setPointerCapture?.(e.pointerId);updateJoystick(e);});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer){e.preventDefault();updateJoystick(e);}});
function releaseJoy(e){if(e.pointerId!==joyPointer)return;joyPointer=null;joyKnob.style.transform='translate(0,0)';['a','d','w','s'].forEach(k=>setVirtualKey(k,false));}
joy.addEventListener('pointerup',releaseJoy);joy.addEventListener('pointercancel',releaseJoy);
addEventListener('contextmenu',e=>{if(e.target.closest('#mobileControls'))e.preventDefault();});

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return Math.random()*(b-a)+a;}
function choice(a){return a[Math.floor(Math.random()*a.length)];}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function norm(x,y){const l=Math.hypot(x,y)||1;return{x:x/l,y:y/l};}
function rectCircle(cx,cy,r,rect){
  const x=clamp(cx,rect.x,rect.x+rect.w),y=clamp(cy,rect.y,rect.y+rect.h);
  const dx=cx-x,dy=cy-y;
  return dx*dx+dy*dy<r*r;
}
function circleCircle(a,b,ra,rb){return Math.hypot(a.x-b.x,a.y-b.y)<ra+rb;}
function pointLineDistance(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
  if(!len2)return Math.hypot(px-x1,py-y1);
  let t=((px-x1)*dx+(py-y1)*dy)/len2;t=clamp(t,0,1);
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function setToast(text,time=2){toast={text,time};}

function ensureAudio(){
  if(audioCtx) return;
  try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){audioCtx=null;}
}
function beep(freq=440,duration=.06,type='square',gain=.02){
  if(!audioCtx)return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);
    const t=audioCtx.currentTime;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    o.start(t);o.stop(t+duration);
  }catch(_){ }
}
function sfx(name){
  if(name==='coin'){beep(740,.06,'triangle',.035);setTimeout(()=>beep(980,.08,'triangle',.028),55);}
  else if(name==='hit')beep(95,.05,'sawtooth',.035);
  else if(name==='power'){beep(180,.1,'sawtooth',.04);setTimeout(()=>beep(520,.15,'triangle',.03),70);}
  else if(name==='dash')beep(260,.08,'square',.026);
  else if(name==='boss'){beep(72,.2,'sawtooth',.05);setTimeout(()=>beep(48,.3,'sawtooth',.04),130);}
  else if(name==='win'){beep(540,.12,'triangle',.03);setTimeout(()=>beep(720,.12,'triangle',.03),90);setTimeout(()=>beep(960,.18,'triangle',.03),190);}
  else if(name==='interact')beep(360,.08,'square',.025);
}

/* ============================== MAP ============================== */
const roads=[];
const sideRoads=[];
function addRoad(x,y,w,h){roads.push({x,y,w,h,type:'main'});}
function addSideRoad(x,y,w,h){sideRoads.push({x,y,w,h,type:'side'});}

// Main avenues: wide and easy to read.
addRoad(0,470,WORLD.w,190);
addRoad(0,1395,WORLD.w,190);
addRoad(0,2330,WORLD.w,190);
addRoad(595,0,190,WORLD.h);
addRoad(1610,0,200,WORLD.h);
addRoad(2685,0,210,WORLD.h);
addRoad(3810,0,220,WORLD.h);

// Side streets: deliberately more numerous.
for(const y of [870,1120,1810,2060,2760,3010]) addSideRoad(0,y,WORLD.w,88);
for(const x of [1180,2190,3300,4380]) addSideRoad(x,0,86,WORLD.h);

const parkAreas=[
  {x:70,y:720,w:470,h:560,name:'Parque Central'},
  {x:3000,y:690,w:610,h:520,name:'Parque Norte'},
  {x:910,y:2520,w:620,h:440,name:'Parque del Río'}
];

const buildings=[];
function addBuilding(x,y,w,h,type='generic',name=''){
  buildings.push({x,y,w,h,type,name});
}
const supermarket={x:4140,y:1015,w:570,h:430};
const supermarketDoor={x:4425,y:1380,w:120,h:70};

// Landmarks. Every named building is placed strictly between streets.
addBuilding(130,90,360,300,'apartment','Bloque A');
addBuilding(830,90,320,300,'office','Torre Norte');
addBuilding(1850,90,300,300,'warehouse','Almacén 7');
addBuilding(2960,90,300,300,'office','Centro Aurora');
addBuilding(4050,90,280,300,'factory','Fábrica Quack-Corp');
addBuilding(110,1640,440,150,'school','Escuela Duckburgia');
addBuilding(810,1620,340,160,'apartment','Bloque Sur');
addBuilding(1840,1615,300,165,'mall','Centro Comercial');
addBuilding(2920,1620,330,155,'office','Torre Delta');
addBuilding(4050,1605,300,165,'warehouse','Depósito Este');
addBuilding(120,2535,420,180,'warehouse','Taller 3');
addBuilding(1850,2540,300,190,'apartment','Bloque Río');
addBuilding(2290,2540,360,190,'office','Nexo Corporativo');
addBuilding(3410,2540,360,190,'school','Instituto Técnico');
addBuilding(4050,2540,300,190,'factory','Planta Sur');

// Generate extra city buildings deterministically. This keeps the map dense while
// guaranteeing that random buildings never overlap streets, parks, landmarks or the supermarket.
let layoutSeed=0xD00C2026;
function layoutRand(){layoutSeed=(layoutSeed*1664525+1013904223)>>>0;return layoutSeed/4294967296;}
function layoutOverlap(a,b,pad=0){return a.x< b.x+b.w+pad && a.x+a.w> b.x-pad && a.y<b.y+b.h+pad && a.y+a.h>b.y-pad;}
function canPlaceCityBuilding(b){
  if(b.x<25||b.y<25||b.x+b.w>WORLD.w-25||b.y+b.h>WORLD.h-25)return false;
  if(roads.some(r=>layoutOverlap(b,r,5))||sideRoads.some(r=>layoutOverlap(b,r,5)))return false;
  if(parkAreas.some(p=>layoutOverlap(b,p,8)))return false;
  if(layoutOverlap(b,supermarket,20))return false;
  if(buildings.some(q=>layoutOverlap(b,q,18)))return false;
  return true;
}
const extraTypes=['generic','apartment','office','warehouse','shop'];
let extraCount=0;
for(let tries=0;tries<5000 && extraCount<27;tries++){
  const w=Math.floor(150+layoutRand()*145);
  const h=Math.floor(120+layoutRand()*85);
  const candidate={x:Math.floor(layoutRand()*(WORLD.w-w-50))+25,y:Math.floor(layoutRand()*(WORLD.h-h-50))+25,w,h,type:choice(extraTypes),name:''};
  if(canPlaceCityBuilding(candidate)){buildings.push(candidate);extraCount++;}
}


const landmarks=[
  {x:230,y:930,r:100,name:'Parque Central',color:'#6ed06a'},
  {x:1110,y:770,r:80,name:'Torre Norte',color:'#5ccfe8'},
  {x:3270,y:860,r:90,name:'Parque Norte',color:'#6ed06a'},
  {x:2060,y:2240,r:85,name:'Centro Comercial',color:'#ffcf54'},
  {x:4320,y:1860,r:85,name:'Depósito Este',color:'#e28b64'},
  {x:1170,y:2760,r:90,name:'Parque del Río',color:'#6ed06a'}
];

const trees=[];
function inAnyRoad(x,y,pad=0){
  for(const r of roads) if(x>r.x-pad&&x<r.x+r.w+pad&&y>r.y-pad&&y<r.y+r.h+pad)return true;
  for(const r of sideRoads) if(x>r.x-pad&&x<r.x+r.w+pad&&y>r.y-pad&&y<r.y+r.h+pad)return true;
  return false;
}
function inPark(x,y){return parkAreas.some(p=>x>p.x&&x<p.x+p.w&&y>p.y&&y<p.y+p.h);}
function validTreeSpot(t,{parkOnly=false}={}){
  if(t.x-t.r<28||t.y-t.r<28||t.x+t.r>WORLD.w-28||t.y+t.r>WORLD.h-28)return false;
  if(inAnyRoad(t.x,t.y,t.r+24))return false;
  if(buildings.some(b=>rectCircle(t.x,t.y,t.r+14,b)))return false;
  if(rectCircle(t.x,t.y,t.r+10,supermarket))return false;
  if(trees.some(q=>Math.hypot(t.x-q.x,t.y-q.y)<t.r+q.r+18))return false;
  if(!parkOnly && parkAreas.some(p=>rectCircle(t.x,t.y,t.r+4,p)))return false;
  return true;
}
function addTreeSafe(candidateFactory,parkOnly=false){
  for(let tries=0;tries<180;tries++){
    const t=candidateFactory();
    if(validTreeSpot(t,{parkOnly})){trees.push(t);return true;}
  }
  return false;
}
for(let i=0;i<260;i++){
  addTreeSafe(()=>({x:rand(45,WORLD.w-45),y:rand(45,WORLD.h-45),r:rand(18,34)}),false);
}
// Add trees in parks intentionally, but never force an invalid fallback.
for(const p of parkAreas){
  for(let i=0;i<32;i++){
    addTreeSafe(()=>({x:rand(p.x+35,p.x+p.w-35),y:rand(p.y+35,p.y+p.h-35),r:rand(18,31)}),true);
  }
}

/* ============================== ENTITIES ============================== */
const player={
  x:500,y:1540,r:23,speed:265,maxHp:140,hp:140,maxEnergy:100,energy:100,
  coins:0,kills:0,rescued:0,explored:new Set(),
  facingX:1,facingY:0,anim:0,attack:0,attackCd:0,powerCd:0,dashCd:0,
  hurt:0,invuln:0,flash:0,score:0,bossDamage:0
};

const coins=[];
const heals=[];
function findOpenHealSpot(sx,sy,r=16){
  const valid=(x,y)=>{
    if(x-r<20||y-r<20||x+r>WORLD.w-20||y+r>WORLD.h-20)return false;
    if(buildings.some(b=>rectCircle(x,y,r+8,b)))return false;
    if(rectCircle(x,y,r+12,supermarket))return false;
    if(trees.some(t=>Math.hypot(x-t.x,y-t.y)<r+t.r+8))return false;
    if(coins.some(c=>!c.collected&&Math.hypot(x-c.x,y-c.y)<r+c.r+30))return false;
    if(heals.some(h=>Math.hypot(x-h.x,y-h.y)<r+h.r+34))return false;
    return true;
  };
  if(valid(sx,sy))return {x:sx,y:sy};
  for(let radius=35;radius<=420;radius+=35){
    for(let step=0;step<24;step++){
      const a=(step/24)*TAU;
      const x=clamp(sx+Math.cos(a)*radius,20+r,WORLD.w-20-r);
      const y=clamp(sy+Math.sin(a)*radius,20+r,WORLD.h-20-r);
      if(valid(x,y))return {x,y};
    }
  }
  for(let y=80;y<WORLD.h-80;y+=80){
    for(let x=80;x<WORLD.w-80;x+=80){
      if(valid(x,y))return {x,y};
    }
  }
  return {x:Math.max(r+25,80),y:Math.max(r+25,80)};
}
function placeHeals(){
  heals.length=0;
  const pts=[
    [430,820],[1320,700],[2250,900],[3260,690],[4140,900],
    [720,1740],[1770,1510],[2510,1830],[3430,1660],[4300,1960],
    [1110,2510],[2050,2670],[3070,2500],[3980,2700]
  ];
  pts.forEach((p,i)=>{
    const pos=findOpenHealSpot(p[0],p[1],16);
    heals.push({x:pos.x,y:pos.y,r:16,pulse:i*.7,collected:false,amount:25});
  });
}
function findOpenCoinSpot(sx,sy,r=13){
  // Never place a coin inside a building, the supermarket, a tree, or outside the map.
  // Try the requested location first, then search outward in a deterministic spiral.
  const valid=(x,y)=>{
    if(x-r<20||y-r<20||x+r>WORLD.w-20||y+r>WORLD.h-20)return false;
    if(buildings.some(b=>rectCircle(x,y,r+7,b)))return false;
    if(rectCircle(x,y,r+10,supermarket))return false;
    if(trees.some(t=>Math.hypot(x-t.x,y-t.y)<r+t.r+7))return false;
    if(coins.some(c=>Math.hypot(x-c.x,y-c.y)<r+c.r+26))return false;
    return true;
  };
  if(valid(sx,sy))return {x:sx,y:sy};
  for(let radius=35;radius<=420;radius+=35){
    for(let step=0;step<24;step++){
      const a=(step/24)*TAU;
      const x=clamp(sx+Math.cos(a)*radius,20+r,WORLD.w-20-r);
      const y=clamp(sy+Math.sin(a)*radius,20+r,WORLD.h-20-r);
      if(valid(x,y))return {x,y};
    }
  }
  // Safe fallback: scan the map grid.
  for(let y=80;y<WORLD.h-80;y+=80){
    for(let x=80;x<WORLD.w-80;x+=80){
      if(valid(x,y))return {x,y};
    }
  }
  for(let y=80;y<WORLD.h-80;y+=80){
    for(let x=80;x<WORLD.w-80;x+=80){
      if(valid(x,y))return{x,y};
    }
  }
  return {x:Math.max(r+25,80),y:Math.max(r+25,80)};
}
function placeCoins(){
  coins.length=0;
  const pts=[
    [270,930],[1090,760],[1480,1040],[2010,760],[2420,1110],[3150,880],
    [3560,560],[4210,690],[4490,1770],[3540,2240],[2650,2700],[1350,2820],
    [560,2820],[1260,2050],[2140,2050],[2860,1100]
  ];
  pts.forEach((p,i)=>{
    const pos=findOpenCoinSpot(p[0],p[1],13);
    coins.push({x:pos.x,y:pos.y,r:13,spin:i*.5,collected:false});
  });
}
placeCoins();
placeHeals();

const npcs=[];
function spawnNPCs(){
  npcs.length=0;
  const pts=[
    [390,820],[530,1210],[980,770],[1430,880],[1740,1120],[2030,830],[2360,1830],
    [2730,1190],[3150,980],[3520,1300],[3860,1800],[4200,520],[4520,1960],[1090,2300]
  ];
  pts.forEach((p,i)=>{
    const pos=safeWorldSpawn(p[0],p[1],18);
    npcs.push({x:pos.x,y:pos.y,r:18,hp:90,maxHp:90,alive:true,dir:rand(0,TAU),speed:i%4===0?82:66,kind:i%4===0?'guard':'civilian',anim:rand(0,9),rescued:false,attackCd:rand(.2,.9),panic:0});
  });
}
spawnNPCs();

const enemies=[];
const enemyDefs={
  normal:{r:20,hp:62,speed:120,damage:9,cd:1.0,points:20},
  thug:{r:29,hp:170,speed:72,damage:20,cd:.9,points:55},
  mutant:{r:23,hp:110,speed:205,damage:14,cd:.72,points:70}
};
function safeWorldSpawn(x,y,r){
  const valid=(px,py)=>!collidesWorld(px,py,r)&&!rectCircle(px,py,r+6,supermarket);
  if(valid(x,y))return{x,y};
  for(let i=0;i<180;i++){
    const px=rand(r+12,WORLD.w-r-12),py=rand(r+12,WORLD.h-r-12);
    if(valid(px,py))return{x:px,y:py};
  }
  for(let py=r+20;py<=WORLD.h-r-20;py+=55){
    for(let px=r+20;px<=WORLD.w-r-20;px+=55){
      if(valid(px,py))return{x:px,y:py};
    }
  }
  return{x:80,y:80};
}
function spawnEnemy(type,x,y){
  const d=enemyDefs[type];
  const pos=(state==='boss')?{x,y}:safeWorldSpawn(x,y,d.r);
  enemies.push({x:pos.x,y:pos.y,type,r:d.r,hp:d.hp,maxHp:d.hp,speed:d.speed,damage:d.damage,attackCd:rand(.1,.8),anim:rand(0,9),hurt:0,alive:true,dir:rand(0,TAU),points:d.points});
}
function spawnEnemies(){

const particles=[];
function burst(x,y,color,count=12,speed=150){
  for(let i=0;i<count;i++){
    const a=rand(0,TAU),s=rand(speed*.25,speed);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.28,.72),max:.72,size:rand(2,6),color,gravity:rand(-40,80)});
  }
}
function ringEffect(x,y,color,radius=60){particles.push({x,y,vx:0,vy:0,life:.45,max:.45,size:radius,color,ring:true});}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;
    if(p.ring)p.size+=260*dt;
    else{p.x+=p.vx*dt;p.vy+=p.gravity*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.07,dt);}
    if(p.life<=0)particles.splice(i,1);
  }
}

/* ============================== WORLD COLLISION ============================== */
function supermarketDoorOpen(x,y,r){
  return x+r>supermarketDoor.x&&x-r<supermarketDoor.x+supermarketDoor.w&&y+r>supermarketDoor.y&&y-r<supermarketDoor.y+supermarketDoor.h;
}
function collidesWorld(x,y,r,opts={}){
  const bossArena=opts.bossArena||false;
  if(x-r<0||y-r<0||x+r>WORLD.w||y+r>WORLD.h)return true;
  if(!bossArena){
    for(const b of buildings)if(rectCircle(x,y,r,b))return true;
    if(rectCircle(x,y,r,supermarket)&&!supermarketDoorOpen(x,y,r))return true;
    for(const t of trees)if(Math.hypot(x-t.x,y-t.y)<r+t.r)return true;
  }else{
    if(x-r<bossArena.x||x+r>bossArena.x+bossArena.w||y-r<bossArena.y||y+r>bossArena.y+bossArena.h)return true;
  }
  return false;
}
function moveBody(o,dx,dy,opts={}){
  const total=Math.hypot(dx,dy);
  const steps=Math.max(1,Math.ceil(total/10));
  const sx=dx/steps,sy=dy/steps;
  for(let i=0;i<steps;i++){
    const nx=o.x+sx;
    if(!collidesWorld(nx,o.y,o.r,opts))o.x=nx;
    const ny=o.y+sy;
    if(!collidesWorld(o.x,ny,o.r,opts))o.y=ny;
  }
}

/* ============================== INTERACTIONS ============================== */
function currentInteractTarget(){
  if(state!=='world')return null;
  // Wide, forgiving supermarket entrance zone — E works from either side.
  const doorCx=supermarketDoor.x+supermarketDoor.w/2;
  const doorCy=supermarketDoor.y+supermarketDoor.h/2;
  if(Math.hypot(player.x-doorCx,player.y-doorCy)<115)return 'supermarket';
  for(const n of npcs){
    if(!n.alive||n.rescued)continue;
    if(Math.hypot(player.x-n.x,player.y-n.y)<72)return n;
  }
  return null;
}
function interact(){
  ensureAudio();
  const target=currentInteractTarget();
  if(target==='supermarket'){
    if(player.coins<5){setToast('El supermercado requiere 5 monedas. Te faltan '+(5-player.coins)+'.',2);sfx('interact');}
    else enterBoss();
    return;
  }
  if(target&&typeof target==='object'){
    target.rescued=true;player.rescued++;player.score+=40;setToast(target.kind==='guard'?'Guardia se une a tu bando.':'Superviviente rescatado.',1.6);burst(target.x,target.y,'#62e5ff',12,140);sfx('interact');
  }
}

function attack(){
  if(player.attackCd>0||player.hurt>0||state!=='world'&&state!=='boss')return;

  const fx=player.x+player.facingX*52,fy=player.y+player.facingY*52;
  burst(fx,fy,'#fff0a0',5,100);sfx('hit');
  for(const e of enemies){
    if(!e.alive)continue;
    const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy);
    const n=norm(dx,dy);const facingDot=n.x*player.facingX+n.y*player.facingY;
    if(d<92&&facingDot>0.2){
      e.hp-=42;e.hurt=.15;moveBody(e,n.x*18,n.y*18,{bossArena:state==='boss'?bossArena:null});burst(e.x,e.y,'#ffcf5b',8,110);

}

function updatePlayer(dt){
  player.attackCd=Math.max(0,player.attackCd-dt);player.powerCd=Math.max(0,player.powerCd-dt);player.dashCd=Math.max(0,player.dashCd-dt);
  player.attack=Math.max(0,player.attack-dt);player.hurt=Math.max(0,player.hurt-dt);player.invuln=Math.max(0,player.invuln-dt);player.flash=Math.max(0,player.flash-dt);

  else player.anim+=dt*3;
  if(pressed.space)attack();

function updateEnemies(dt){
  for(const e of enemies){
    if(!e.alive)continue;
    e.anim+=dt*(e.type==='mutant'?13:7);e.hurt=Math.max(0,e.hurt-dt);e.attackCd-=dt;
    const d=dist(player,e);
    const chaseRange=e.type==='mutant'?700:560;
    if(d<chaseRange){
      if(d>e.r+player.r+14){
        const a=Math.atan2(player.y-e.y,player.x-e.x);moveBody(e,Math.cos(a)*e.speed*dt,Math.sin(a)*e.speed*dt,{bossArena:state==='boss'?bossArena:null});
      }else if(e.attackCd<=0&&player.invuln<=0){
        player.hp-=e.damage;player.hurt=.25;player.invuln=.42;player.flash=.16;shake=Math.max(shake,8);burst(player.x,player.y,'#ff5252',10,140);e.attackCd=e.type==='mutant'?.62:1.0;sfx('hit');
      }
    }else{
      if(Math.random()<.012)e.dir=rand(0,TAU);
      moveBody(e,Math.cos(e.dir)*e.speed*.16*dt,Math.sin(e.dir)*e.speed*.16*dt,{bossArena:state==='boss'?bossArena:null});
    }
  }
}
function updateNPCs(dt){
  for(const n of npcs){
    if(!n.alive)continue;
    n.anim+=dt*5;n.attackCd-=dt;n.panic=Math.max(0,n.panic-dt);
    let danger=null,best=220;
    for(const e of enemies){if(!e.alive)continue;const d=dist(n,e);if(d<best){best=d;danger=e;}}
    if(danger){
      n.panic=1;
      const a=Math.atan2(n.y-danger.y,n.x-danger.x);
      moveBody(n,Math.cos(a)*n.speed*dt,Math.sin(a)*n.speed*dt,{bossArena:state==='boss'?bossArena:null});
      if(n.kind==='guard'&&dist(n,danger)<155&&n.attackCd<=0){danger.hp-=13;danger.hurt=.1;burst(danger.x,danger.y,'#7bb7ff',4,90);n.attackCd=.72;if(danger.hp<=0){danger.alive=false;player.kills++;player.score+=danger.points;}}
    }else{
      if(Math.random()<.009)n.dir=rand(0,TAU);
      moveBody(n,Math.cos(n.dir)*n.speed*.35*dt,Math.sin(n.dir)*n.speed*.35*dt,{bossArena:state==='boss'?bossArena:null});

  }
}

function drawRoundedRect(x,y,w,h,r,fill,stroke=null,lw=1){

}
function drawBossHUD(){
  drawPanel(W/2-360,18,720,90,.9);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 21px Arial';ctx.fillText('THE ALPHA ROOSTER — SUJETO 02',W/2,49);ctx.fillStyle='#2b1719';ctx.fillRect(W/2-325,65,650,21);ctx.fillStyle=boss.phase===3?'#ff4e50':boss.phase===2?'#5ee3f5':'#e64b4b';ctx.fillRect(W/2-325,65,650*(boss.hp/boss.maxHp),21);ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText('FASE '+boss.phase+'   '+Math.ceil(boss.hp)+' / '+boss.maxHp,W/2,81);
  drawPanel(16,16,330,130);ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='900 20px Arial';ctx.fillText('DUCKPOCALYPSE',30,43);ctx.fillStyle='#ffd33e';ctx.font='900 17px Arial';ctx.fillText('VIDA',30,76);ctx.fillStyle='#2b3136';ctx.fillRect(30,88,230,16);ctx.fillStyle='#e84e4e';ctx.fillRect(30,88,230*(player.hp/player.maxHp),16);ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.fillText(Math.ceil(player.hp)+' / '+player.maxHp,270,100);ctx.fillStyle='#4eddf2';ctx.fillRect(30,111,230*(player.energy/player.maxEnergy),11);ctx.fillStyle='#fff';ctx.fillText('ENERGÍA',270,120);
  drawMinimap();
}
function drawMenu(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071119');g.addColorStop(1,'#17281b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<24;i++){const bw=50+(i*37)%110,bh=100+(i*71)%260,x=i*64;ctx.fillStyle=i%4===0?'#0e1b21':'#11221b';ctx.fillRect(x,H-75-bh,bw,bh);for(let wy=H-55-bh;wy<H-100;wy+=34){ctx.fillStyle='rgba(235,206,99,.15)';ctx.fillRect(x+11,wy,9,7);ctx.fillRect(x+30,wy,9,7);}}
  // title
  ctx.textAlign='center';ctx.fillStyle='#ffe15d';ctx.font='900 80px Arial';ctx.fillText('DUCKPOCALYPSE',W/2,170);ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.fillText('EL PATO TIENE LA CULPA',W/2,208);
  drawDuck({x:W/2,y:320,r:23,anim:elapsed*2,facingX:1,facingY:0,attack:0,flash:0});
  drawPanel(W/2-290,405,580,230,.88);ctx.strokeStyle='#4ed8ef';ctx.lineWidth=2;ctx.strokeRect(W/2-290,405,580,230);
  ctx.fillStyle='#fff';ctx.font='900 26px Arial';ctx.fillText('PULSA ENTER O ESPACIO PARA JUGAR',W/2,450);
  ctx.fillStyle='#bfc8cd';ctx.font='15px Arial';ctx.fillText('WASD / Flechas — mover',W/2,490);ctx.fillText('ESPACIO — picotazo   Q — poder   SHIFT — dash',W/2,520);ctx.fillText('E — interactuar   P — pausar',W/2,550);
  ctx.fillStyle='#68ef78';ctx.font='bold 14px Arial';ctx.fillText('Mejor puntuación: '+bestScore(),W/2,590);
}
function drawPause(){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 78px Arial';ctx.fillText('PAUSA',W/2,310);ctx.font='20px Arial';ctx.fillStyle='#bfc8cd';ctx.fillText('Pulsa P para continuar',W/2,360);}
function drawEnd(won){
  ctx.fillStyle='rgba(0,0,0,.86)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=won?'#ffd83d':'#ff5b5b';ctx.font='900 88px Arial';ctx.fillText(won?'¡GANASTE!':'HAS PERDIDO',W/2,220);
  ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.fillText(won?'DUCKPOCALYPSE COMPLETADO':'El pato fue derrotado',W/2,270);
  ctx.fillStyle='#c5ced2';ctx.font='18px Arial';
  if(won){ctx.fillText('El Sujeto 02 fue destruido y el laboratorio quedó en silencio.',W/2,310);ctx.fillText('Misiones completadas: '+missions.filter(m=>m.done).length+'/'+missions.length,W/2,348);ctx.fillStyle='#68ed7a';ctx.font='bold 22px Arial';ctx.fillText('PUNTUACIÓN: '+player.score+'   •   XP: '+missionXP,W/2,390);}
  else{ctx.fillText('Las monedas no se han perdido. El pato puede volver a intentarlo.',W/2,325);ctx.fillText('Puntuación: '+player.score,W/2,360);}
  ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('ENTER / R — volver a jugar',W/2,485);
}

/* ============================== CAMERA ============================== */
function updateCamera(){
  const targetX=state==='boss'?bossArena.x+bossArena.w/2-W/2:player.x-W/2;
  const targetY=state==='boss'?bossArena.y+bossArena.h/2-H/2:player.y-H/2;
  camera.x=lerp(camera.x,clamp(targetX,0,WORLD.w-W),.11);camera.y=lerp(camera.y,clamp(targetY,0,WORLD.h-H),.11);
}

/* ============================== MAIN UPDATE ============================== */
function updateWorld(dt){
  updatePlayer(dt);
  if(state==='lost')return;
  updateCoins();updateEnemies(dt);updateNPCs(dt);updateExploration();updateMissions();updateParticles(dt);updateCamera();
  if(player.hp<=0)state='lost';
}
function updateBoss(dt){
  updatePlayer(dt);
  if(state==='lost'){updateParticles(dt);return;}
  updateEnemies(dt);boss.update(dt);updateBossObjects(dt);updateParticles(dt);updateCamera();updateMissions();
  if(player.hp<=0)state='lost';
}
function update(dt){
  elapsed+=dt;if(toast.time>0)toast.time-=dt;
  if(pressed.p&&(state==='world'||state==='boss'))paused=!paused;
  if((state==='lost'||state==='won')&&(pressed.r||pressed.enter)){resetGame();startGame();}
  if(state==='menu'&&(pressed.enter||pressed.space)){startGame();}
  if(paused)return;
  if(state==='world')updateWorld(dt);
  else if(state==='boss')updateBoss(dt);
  else updateParticles(dt);
}

/* ============================== RENDER ============================== */
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  if(state==='menu'){drawMenu();return;}
  shake*=.88;const sx=shake>0?rand(-shake,shake):0,sy=shake>0?rand(-shake,shake):0;ctx.save();ctx.translate(sx,sy);
  let camX=state==='boss'?bossArena.x+bossArena.w/2-W/2:camera.x;let camY=state==='boss'?bossArena.y+bossArena.h/2-H/2:camera.y;camX=clamp(camX,0,WORLD.w-W);camY=clamp(camY,0,WORLD.h-H);
  ctx.translate(-camX,-camY);
  if(state==='world'||state==='lost'||state==='won'){drawWorld();}
  if(state==='boss'||state==='won'){drawArena();}
  npcs.forEach(drawNPC);enemies.forEach(drawChicken);drawDuck(player);if(state==='boss')drawBoss();if(state==='boss')drawProjectiles();drawParticles();
  ctx.restore();
  if(state==='boss')drawBossHUD();else if(state==='world'||state==='lost'||state==='won')drawHUD();
  if(paused&&(state==='world'||state==='boss'))drawPause();
  if(state==='won')drawEnd(true);if(state==='lost')drawEnd(false);
}

/* ============================== GAME LOOP ============================== */
function loop(now){
  const dt=Math.min(.033,Math.max(.001,(now-lastTime)/1000));lastTime=now;update(dt);render();
  for(const k in pressed)delete pressed[k];
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
